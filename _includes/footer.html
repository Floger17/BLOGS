<!-- ESTILOS DIRECTOS (Garantiza funcionamiento en Móvil y PC + Oculta RSS) -->
<style>
  /* 1. Ocultar enlace RSS/Subscribe */
  .feed-subscribe, 
  p.feed-subscribe, 
  a[href*="feed.xml"] {
    display: none !important;
  }

  /* 2. Disposición en Ordenador y Móvil Horizontal (2 columnas) */
  .footer-flex-container {
    display: flex !important;
    justify-content: space-between !important;
    align-items: flex-start !important;
    gap: 20px !important;
    width: 100% !important;
    margin-bottom: 1.5rem !important;
  }

  .footer-col-left {
    width: 55% !important;
  }

  .footer-col-right {
    width: 45% !important;
  }

  /* 3. Disposición en Móvil Vertical (Pantallas menores a 650px) */
  @media screen and (max-width: 650px) {
    .footer-flex-container {
      flex-direction: column !important;
      gap: 12px !important;
    }

    .footer-col-left, 
    .footer-col-right {
      width: 100% !important;
    }
  }

  /* 4. Estilos de los iconos de Redes Sociales */
  .social-icons-grid {
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 1.2rem !important;
    margin-top: 1.5rem !important;
    margin-bottom: 0.5rem !important;
    flex-wrap: wrap !important;
  }

  .social-icon-link {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    transition: transform 0.25s ease, filter 0.25s ease !important;
  }

  .social-icon-img {
    height: 38px !important;
    width: auto !important;
    object-fit: contain !important;
  }

  .social-icon-link:hover {
    transform: scale(1.2) !important;
    filter: brightness(1.2) !important;
  }
</style>

<!-- SCRIPT GLOBAL ANTI-IMPRESIÓN, ANTI-INSPECCIÓN Y ANTI-COPIA -->
<script>
  // 1. Desactivar clic derecho
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  }, false);

  // 2. Desactivar arrastre de elementos e imágenes
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
  }, false);

  // 3. Bloquear atajos de teclado (Impresión, F12, Ver Código Fuente, Guardar)
  document.addEventListener('keydown', function(e) {
    if (
      // Ctrl+P / Cmd+P (Imprimir)
      ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P' || e.keyCode === 80)) ||
      // F12 (Herramientas de Desarrollador)
      e.key === 'F12' || e.keyCode === 123 ||
      // Ctrl+U / Cmd+U (Ver código fuente)
      ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) ||
      // Ctrl+Shift+I / J / C (Herramientas de Desarrollador)
      ((e.ctrlKey || e.metaKey) && e.shiftKey && (
        e.key === 'I' || e.key === 'i' || 
        e.key === 'J' || e.key === 'j' || 
        e.key === 'C' || e.key === 'c'
      )) ||
      // Ctrl+S / Cmd+S (Guardar página)
      ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83))
    ) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
  }, true);

  // 4. Medida de respaldo para controlar la impresión desde el menú del navegador
  window.onbeforeprint = function() {
    document.body.style.display = 'none';
  };
  window.onafterprint = function() {
    document.body.style.display = 'block';
  };
</script>
