<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <div class="footer-col-wrapper">
      <!-- Ampliamos la columna 1 para que entre el texto completo -->
      <div class="footer-col footer-col-1" style="width: 45%;">
        <ul class="contact-list">
          <li><strong>{{ site.author | escape }}</strong></li>
          <li><em style="white-space: nowrap;">Estudiante de Ingeniería Geomática y Topografía</em></li>
          <li><em>Precolegiado Nº PR00205</em></li>
        </ul>
      </div>

      <div class="footer-col footer-col-2" style="width: 15%;">
        {%- include social.html -%}
      </div>

      <!-- Ajustamos la columna 3 proporcionalmente -->
      <div class="footer-col footer-col-3" style="width: 35%;">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

  </div>
</footer>
