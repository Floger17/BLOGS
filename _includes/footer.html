<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title | escape }}</h2>

    <!-- Flexbox para alinear perfectamente la parte superior de las columnas -->
    <div class="footer-col-wrapper" style="display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap;">
      
      <!-- Columna 1: Tu información -->
      <div class="footer-col footer-col-1" style="flex: 1 1 50%; max-width: 55%; margin: 0; padding-right: 20px;">
        <ul class="contact-list" style="margin: 0; padding: 0; list-style: none;">
          <li style="margin-bottom: 2px;"><strong>{{ site.author | escape }}</strong></li>
          <li style="margin-bottom: 2px;"><em style="white-space: nowrap;">Estudiante de Ingeniería Geomática y Topografía</em></li>
          <li style="margin-bottom: 0;"><em>Precolegiado Nº PR00205</em></li>
        </ul>
      </div>

      <!-- Columna 2: Redes del tema (si las hay) -->
      <div class="footer-col footer-col-2" style="margin: 0;">
        {%- include social.html -%}
      </div>

      <!-- Columna 3: Descripción del sitio -->
      <div class="footer-col footer-col-3" style="flex: 1 1 40%; max-width: 40%; margin: 0;">
        <p style="margin: 0;">{{ site.description | escape }}</p>
      </div>

    </div>

  </div>
</footer>
