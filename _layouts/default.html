<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <!-- Contenedor donde se dibuja el contenido -->
        <div id="site-global-content"></div>

        <!-- Almacenamiento seguro del contenido codificado -->
        <script type="text/template" id="raw-b64-data">
          {{ content | base64_encode }}
        </script>

        <script>
          (function() {
            try {
              var b64String = document.getElementById('raw-b64-data').textContent.trim();
              
              // Decodificación segura para UTF-8 y caracteres en español
              var binaryString = atob(b64String);
              var bytes = new Uint8Array(binaryString.length);
              for (var i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
              }
              var decodedHTML = new TextDecoder('utf-8').decode(bytes);
              
              document.getElementById('site-global-content').innerHTML = decodedHTML;
            } catch (e) {
              console.error("Error al renderizar el contenido:", e);
            }
          })();
        </script>
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
