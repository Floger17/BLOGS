<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        <!-- Contenedor donde se insertará el contenido desencriptado -->
        <div id="site-global-content"></div>

        <!-- Guardamos el contenido en un bloque seguro sin romper la sintaxis de JS -->
        <script type="text/template" id="raw-b64-data">
          {{ content | base64_encode }}
        </script>

        <script>
          (function() {
            try {
              // Extraemos la cadena codificada y eliminamos espacios en blanco/saltos de línea
              var b64String = document.getElementById('raw-b64-data').textContent.trim();
              
              // Decodificamos el contenido usando la codificación UTF-8 adecuada
              var decodedHTML = decodeURIComponent(escape(atob(b64String)));
              
              // Inyectamos el HTML directamente en la pantalla
              document.getElementById('site-global-content').innerHTML = decodedHTML;
            } catch (e) {
              console.error("Error al renderizar el contenido protegido.");
            }
          })();
        </script>
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
